name: novel_notification
description: "Web小説更新通知アプリ"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.0.0

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Routing
  go_router: ^14.0.0

  # Theme
  flex_color_scheme: ^8.0.0

  # Local Storage
  shared_preferences: ^2.3.0

  # HTTP
  dio: ^5.7.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.20.0
  timeago: ^3.7.0

  # Share
  share_plus: ^10.0.0

  # App version
  package_info_plus: ^8.0.0

  # Push Notifications (Firebase)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.0
  json_serializable: ^6.9.0

  # App Icon Generation
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env.development
    - .env.production
    - docs/privacy_policy.md
    - docs/terms_of_service.md

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "docs/icon/novelmark_icon_1024.png"
  image_path: "docs/icon/novelmark_icon_1024.png"
  min_sdk_android: 21
